name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "sw/rust/**"
      - "sw/cpp/**"
      - "hw/rtl/**"
      - "hw/tools/**"
      - "hw/synth/yosys/*.ys"
      - "hw/synth/yosys/run.sh"
      - "hw/synth/yosys/run_pnr.sh"
      - "hw/synth/yosys/upduino31_demo.pcf"
      - "hw/openroad/**"
      - "hw/Makefile"
      - "hw/Dockerfile"
      - "run.sh"
      - ".github/workflows/*.yml"
      - "!sw/rust/**/*.md"
      - "!**/*.qmd"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sw/rust
      - name: Full pipeline (fmt, clippy, build, test, no_alloc, c++ core)
        run: bash run.sh --check

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: cpp_filter
        with:
          filters: |
            cpp:
              - 'sw/cpp/**'
      - name: C++ pipeline (configure, build, test)
        if: steps.cpp_filter.outputs.cpp == 'true'
        run: bash sw/cpp/run.sh

  cpp-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: cpp_bench_filter
        with:
          filters: |
            cpp:
              - 'sw/cpp/**'
      - name: C++ benchmarks
        if: steps.cpp_bench_filter.outputs.cpp == 'true'
        run: bash sw/cpp/run.sh --bench

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sw/rust
      - name: Build + test + core benchmarks
        run: bash run.sh --bench

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sw/rust
      - name: Build API docs
        run: bash run.sh --doc

  hw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: hw_filter
        with:
          filters: |
            hw_gate:
              - 'hw/rtl/**'
              - 'hw/tools/**'
              - 'hw/synth/yosys/*.ys'
              - 'hw/synth/yosys/run.sh'
              - 'hw/synth/yosys/run_pnr.sh'
              - 'hw/synth/yosys/upduino31_demo.pcf'
              - 'hw/Makefile'
              - 'hw/Dockerfile'
              - 'run.sh'
              - '.github/workflows/*.yml'
            orfs:
              - 'hw/openroad/**'
              - '.github/workflows/*.yml'
      - name: Build hardware verification image (runs sim, golden, gatesim, equiv, synth, PnR)
        if: steps.hw_filter.outputs.hw_gate == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hw/Dockerfile
          push: false
          tags: tagma-hw:latest
          cache-from: type=gha,scope=tagma-hw
          cache-to: type=gha,mode=max,scope=tagma-hw
      - name: Run Sky130 standard cell flow (ORFS)
        if: steps.hw_filter.outputs.hw_gate == 'true' || steps.hw_filter.outputs.orfs == 'true'
        run: bash hw/openroad/run.sh
      - name: Upload Sky130 reports
        if: steps.hw_filter.outputs.hw_gate == 'true' || steps.hw_filter.outputs.orfs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sky130-reports
          path: hw/openroad/results
